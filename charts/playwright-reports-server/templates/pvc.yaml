{{- if and (eq .Values.storage.type "fs") .Values.storage.fs.persistence.enabled (not .Values.storage.fs.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "prs.dataClaimName" . }}
  labels:
    {{- include "prs.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.fs.persistence.accessModes | nindent 4 }}
  {{- with .Values.storage.fs.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.fs.persistence.size }}
{{- end }}
